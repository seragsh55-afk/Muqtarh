<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الأدمن - بلاغات الكهرباء</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma;background:#f0f2f5;padding:15px}
table{width:100%;background:#fff;border-collapse:collapse;border-radius:10px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:14px}
th{background:#111827;color:#fff}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;margin:2px}
.edit{background:#3b82f6;color:#fff}.del{background:#ef4444;color:#fff}.print{background:#10b981;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center}
.add{background:#f59e0b;color:#fff;padding:10px 20px;font-weight:bold}
#formCard{display:none;background:#fff;padding:20px;border-radius:10px;margin:15px 0}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
@media print{body *{visibility:hidden} #printArea, #printArea *{visibility:visible} #printArea{position:absolute;top:0;right:0;width:100%;padding:20px}}
</style>
</head>
<body>
<div class="top"><h2>⚡ بلاغات قطوعات الكهرباء - الأدمن</h2><button class="add" onclick="showForm()">+ إضافة بلاغ جديد</button></div>

<div id="formCard">
<h3 id="formTitle">بلاغ جديد</h3>
<input id="f_name" placeholder="الاسم">
<input id="f_meter" placeholder="رقم العداد">
<input id="f_address" placeholder="العنوان">
<input id="f_phone" placeholder="رقم الهاتف">
<input type="date" id="f_date">
<input id="f_location" placeholder="الموقع">
<select id="f_status" style="width:100%;padding:10px;margin:5px 0"><option>قيد المراجعة</option><option>تمت المعالجة</option><option>مرفوض</option></select>
<button onclick="save()" style="background:#111827;color:#fff;width:100%;padding:12px">حفظ</button>
</div>

<table><thead><tr><th>الاسم</th><th>العداد</th><th>العنوان</th><th>الهاتف</th><th>التاريخ</th><th>الموقع</th><th>الحالة</th><th>تحكم</th></tr></thead><tbody id="tbody"></tbody></table>

<div id="printArea" style="display:none"></div>

<script>
const SUPABASE_URL = "حط هنا الـ Project URL بتاعك";
const SUPABASE_KEY = "حط هنا الـ anon public key بتاعك";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let editId = null;
let allData = [];

async function load(){
  const { data } = await supabase.from('reports').select('*').order('id',{ascending:false});
  allData = data || [];
  document.getElementById('tbody').innerHTML = allData.map(r=>`
  <tr><td>${r.name}</td><td>${r.meter_number}</td><td>${r.address}</td><td>${r.phone}</td><td>${r.report_date}</td><td>${r.location}</td><td>${r.status}</td>
  <td>
    <button class="edit" onclick="editReport(${r.id})">تعديل</button>
    <button class="del" onclick="deleteReport(${r.id})">حذف</button>
    <button class="print" onclick="printReport(${r.id})">إصدار إفادة</button>
  </td></tr>`).join('');
}
function showForm(){ document.getElementById('formCard').style.display='block'; editId=null; document.getElementById('formTitle').innerText='بلاغ جديد'; }
async function save(){
  const obj = { name:f_name.value, meter_number:f_meter.value, address:f_address.value, phone:f_phone.value, report_date:f_date.value, location:f_location.value, status:f_status.value };
  if(editId) await supabase.from('reports').update(obj).eq('id',editId);
  else await supabase.from('reports').insert([obj]);
  document.getElementById('formCard').style.display='none'; load();
}
function editReport(id){
  const r = allData.find(x=>x.id===id); editId=id;
  f_name.value=r.name; f_meter.value=r.meter_number; f_address.value=r.address; f_phone.value=r.phone; f_date.value=r.report_date; f_location.value=r.location; f_status.value=r.status;
  document.getElementById('formCard').style.display='block'; document.getElementById('formTitle').innerText='تعديل بلاغ رقم '+id;
  window.scrollTo(0,0);
}
async function deleteReport(id){ if(confirm('متأكد تحذف البلاغ؟')){ await supabase.from('reports').delete().eq('id',id); load(); } }
function printReport(id){
  const r = allData.find(x=>x.id===id);
  document.getElementById('printArea').innerHTML = `
  <div style="text-align:center;border:2px solid #000;padding:30px;font-family:Tahoma">
  <h1>إفادة بلاغ قطوعات كهرباء</h1><hr>
  <p>رقم البلاغ: ${r.id}</p>
  <p>الاسم: ${r.name}</p>
  <p>رقم العداد: ${r.meter_number}</p>
  <p>العنوان: ${r.address}</p>
  <p>رقم الهاتف: ${r.phone}</p>
  <p>تاريخ البلاغ: ${r.report_date}</p>
  <p>الموقع: ${r.location}</p>
  <p>الحالة: ${r.status}</p>
  <br><p>تشهد إدارة الكهرباء بأن البلاغ أعلاه مسجل لديها وتمت معالجته حسب الإجراءات.</p>
  <br><br><p>التوقيع: .................... &nbsp;&nbsp; الختم: ....................</p>
  <p>التاريخ: ${new Date().toLocaleDateString('ar')}</p>
  </div>`;
  document.getElementById('printArea').style.display='block';
  window.print();
  document.getElementById('printArea').style.display='none';
}
load();
</script>
</body>
  </html>
